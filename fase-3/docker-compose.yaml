services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    healthcheck:
      test: curl --fail http://localhost:8000/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      api:
        condition: service_healthy
